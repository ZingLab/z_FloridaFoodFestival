{% assign f = include.festival %}
{% assign f_url = site.url | append: f.url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "FoodEvent",
      "@id": {{ f_url | append: "#event" | jsonify }},
      "name": {{ f.title | jsonify }},
      "description": {{ f.short | jsonify }},
      "url": {{ f_url | jsonify }},
      "image": [{{ site.url | append: f.featured_image | jsonify }}],
      "startDate": {{ f.start_date | jsonify }},
      "endDate": {{ f.end_date | jsonify }},
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "isAccessibleForFree": {% if f.admission == "free" %}true{% else %}false{% endif %},
      "keywords": {{ f.categories | join: ", " | jsonify }},
      "location": {
        "@type": "Place",
        "name": {{ f.venue | jsonify }},
        "address": {
          "@type": "PostalAddress",
          {% if f.street_address %}"streetAddress": {{ f.street_address | jsonify }},{% endif %}
          "addressLocality": {{ f.city | jsonify }},
          "addressRegion": "FL",
          {% if f.postal_code %}"postalCode": {{ f.postal_code | jsonify }},{% endif %}
          "addressCountry": "US"
        }{% if f.latitude %},
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": {{ f.latitude }},
          "longitude": {{ f.longitude }}
        }{% endif %}
      },
      "organizer": {
        "@type": "Organization",
        "name": {{ f.organizer | jsonify }}{% if f.website %},
        "url": {{ f.website | jsonify }}{% endif %}
      }{% if f.website or f.admission == "free" %},
      "offers": {
        "@type": "Offer",
        "url": {{ f.website | default: f_url | jsonify }},
        {% if f.admission == "free" %}"price": "0",{% endif %}
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "description": {{ f.price | jsonify }}
      }{% endif %}{% if f.sponsor and f.sponsor.name %},
      "sponsor": {
        "@type": "Organization",
        "name": {{ f.sponsor.name | jsonify }}{% if f.sponsor.url %},
        "url": {{ f.sponsor.url | jsonify }}{% endif %}
      }{% endif %}
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ site.url | append: "/" | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": "Florida Food Festivals", "item": {{ site.url | append: "/festivals/" | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ f.title | jsonify }}, "item": {{ f_url | jsonify }} }
      ]
    }{% if f.faq %},
    {
      "@type": "FAQPage",
      "mainEntity": [{% for item in f.faq %}
        {
          "@type": "Question",
          "name": {{ item.q | jsonify }},
          "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} }
        }{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    }{% endif %}
  ]
}
</script>
