# Site settings
title: Florida Food Festival - A Celebration of Florida's Culinary Delights
email: info@floridafoodfestival.com
description: >- 
  Join us at the Florida Food Festival, showcasing the finest cuisine, 
  local produce, and culinary talent that Florida has to offer.
timezone: America/New_York # build dates (festival end dates, sponsorships) use Florida time
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://floridafoodfestival.com" # the base hostname & protocol
twitter_username: flafoodfest
github_username: floridafoodfestival
author: Florida Food Festival Team
og_image: /assets/images/header-bg.jpg
keywords: "Florida, food festival, recipes, events, seafood, citrus, local produce"

# Build settings
markdown: kramdown
theme: minima
remote_theme: jekyll/minima
github: [metadata]
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from


# Permalink structure for blog posts
permalink: /events/:year/:month/:day/:title/

# Collections
collections:
  vendors:
    output: true
    permalink: /vendors/:name/
  events:
    output: true
    permalink: /special-events/:name/
  festivals:
    output: true
    permalink: /festivals/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Florida Food Festival Team"
      excerpt_separator: <!--more-->
  - scope:
      path: ""
      type: "vendors"
    values:
      layout: "vendor"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "festivals"
    values:
      layout: "festival"
      og_type: "article"
  - scope:
      path: "events"
    values:
      layout: "events"
      title: "Florida Food Festival Events"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md

# Sponsorship, claim and listing inquiries.
# Set form_endpoint to a form backend URL (e.g. https://formspree.io/f/xxxx) to
# collect submissions; when blank, forms open a prefilled email to inquiry_email.
contact:
  inquiry_email: hi@zinglab.com
  form_endpoint: ""
  # Claim/Sponsor links on festival pages open an email to this address.
  # Subjects are built per festival as "<prefix><festival title>".
  listings_email: florida@zinglab.com
  claim_subject_prefix: "Claim: "
  sponsor_subject_prefix: "Sponsor: "

# Google Analytics
google_analytics: G-DW82LSZY3F